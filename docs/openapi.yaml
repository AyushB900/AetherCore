openapi: 3.0.3
info:
  title: AetherCore Banking Ledger
  version: 0.1.0
  description: Internal USD ledger demo. Deposits simulate external funding; no real payment rails.
servers:
  - url: http://localhost:8080
security:
  - ServiceKey: []
paths:
  /api/v1/accounts:
    post:
      summary: Create zero-balance customer account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerName, currency]
              properties:
                ownerName: {type: string, minLength: 1, maxLength: 120}
                currency: {type: string, enum: [USD]}
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {description: Missing or invalid API key}
  /api/v1/accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Read an account
      operationId: getAccount
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/accounts/{id}/entries:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Journal cursor page ordered by entry ID
      operationId: listEntries
      parameters:
        - in: query
          name: after
          schema: {type: integer, format: int64, minimum: 0, default: 0}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Journal entries; pass the last id as after for the next page
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer, format: int64}
                    transfer_id: {type: string, format: uuid}
                    side: {type: string, enum: [DEBIT, CREDIT]}
                    amount_minor: {type: integer, format: int64}
                    created_at: {type: string, format: date-time}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/transfers:
    post:
      summary: Atomic customer-to-customer transfer
      operationId: postTransfer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MoveMoney'}
      responses:
        '201': {$ref: '#/components/responses/Receipt'}
        '200': {$ref: '#/components/responses/Replay'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/deposits:
    post:
      summary: Privileged simulated USD external funding
      operationId: postDeposit
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destinationId, amountMinor, currency]
              properties:
                destinationId: {type: string, format: uuid}
                amountMinor: {$ref: '#/components/schemas/Amount'}
                currency: {type: string, enum: [USD]}
      responses:
        '201': {$ref: '#/components/responses/Receipt'}
        '200': {$ref: '#/components/responses/Replay'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/transfers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Read immutable transfer receipt
      operationId: getTransfer
      responses:
        '200':
          description: Receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transfer'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/reconciliation:
    get:
      summary: Snapshot-consistent ledger and projection checks
      operationId: reconcile
      responses:
        '200':
          description: All three balance/drift fields should be zero
          content:
            application/json:
              schema:
                type: object
                properties:
                  drifted_accounts: {type: integer, format: int64}
                  unbalanced_transfers: {type: integer, format: int64}
                  net_balance_minor: {type: number}
                  transfer_count: {type: integer, format: int64}
                  pending_events: {type: integer, format: int64}
  /actuator/health:
    get:
      summary: Application and database health, not event-delivery readiness
      operationId: health
      security: []
      responses:
        '200': {description: Healthy}
        '503': {description: Unhealthy}
components:
  securitySchemes:
    ServiceKey: {type: apiKey, in: header, name: X-API-Key}
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Global durable key. Retry identical payloads with the same key. Changed payload returns 409.
      schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$', maxLength: 128}
  schemas:
    Amount: {type: integer, format: int64, minimum: 1, maximum: 1000000000000, description: Integer USD cents}
    Account:
      type: object
      properties:
        id: {type: string, format: uuid}
        ownerName: {type: string}
        currency: {type: string, enum: [USD]}
        kind: {type: string, enum: [CUSTOMER, CLEARING]}
        balanceMinor: {type: integer, format: int64}
    MoveMoney:
      type: object
      required: [sourceId, destinationId, amountMinor, currency]
      properties:
        sourceId: {type: string, format: uuid}
        destinationId: {type: string, format: uuid}
        amountMinor: {$ref: '#/components/schemas/Amount'}
        currency: {type: string, enum: [USD]}
    Transfer:
      type: object
      properties:
        id: {type: string, format: uuid}
        sourceId: {type: string, format: uuid}
        destinationId: {type: string, format: uuid}
        amountMinor: {$ref: '#/components/schemas/Amount'}
        currency: {type: string, enum: [USD]}
        operation: {type: string, enum: [TRANSFER, DEPOSIT]}
        createdAt: {type: string, format: date-time}
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
  responses:
    Receipt:
      description: First successful posting
      headers:
        Idempotency-Replayed:
          schema: {type: boolean, example: false}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Transfer'}
    Replay:
      description: Original receipt; no additional money moved
      headers:
        Idempotency-Replayed:
          schema: {type: boolean, example: true}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Transfer'}
    Problem:
      description: Invalid request, missing resource, key conflict, insufficient funds, or retryable transaction error
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
